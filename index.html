<!doctype html>
<html lang="sr-Cyrl-RS">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="АрхиБорд — одбор за одрживу архитектуру" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F5D46'/%3E%3Cpath d='M8 25V13l8-5 8 5v12' fill='none' stroke='%23F6F4EF' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 25c0-5 2-8 6-9-1 4-3 7-6 9Z' fill='%23DCE7DF'/%3E%3Cpath d='M12 25v-6h4' fill='none' stroke='%23F6F4EF' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="АрхиБорд" />
    <title>АрхиБорд</title>
    <script>
      // Apply the persisted manual theme before first paint (avoids a flash). "system" = no attribute.
      (function () {
        try {
          var t = localStorage.getItem('archiboard-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
